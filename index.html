<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Meditation Bell</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#000000">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="img/bell-32.png" sizes="32x32">
    <link rel="apple-touch-icon" href="img/bell-128.png">
    <link href="css/style.css" rel="stylesheet">
  </head>
  <body>
    <div class="background">
      <audio id="bell" src="sounds/bell.mp3" preload="auto"></audio>
      <div id="content">
      </div>
      <button id="theme-toggle" aria-label="Toggle light/dark mode">☀️</button>
    </div>

    <template id="tmpl-meditation">
      <div id="meditation-dialog" style="display: none;">
        <div class="meditation-timer">
          <p id="meditation-text"></p>
          <div id="time-options"></div>
          <div id="start-button" class="full-btn">Begin</div>
        </div>
        <div id="about-link">
          <a href="#">About</a>
        </div>
      </div>
    </template>

    <template id="tmpl-about">
      <div id="about-dialog" style="display: none;">
        <p>Written by <a href="https://wrla.ch" target="_blank" rel="noopener">Will Lachance</a> in the hopes that others will find it helpful. Source code freely <a href="https://github.com/wlach/meditation" target="_blank" rel="noopener">available</a> under the unlicense.</p>
        <p>Bell sound from "Kerri" at <a href="https://freesound.org/people/kerri/sounds/27421/" target="_blank" rel="noopener">freesound</a>.</p>
        <p>Some design inspiration taken from <a href="https://helloform.com/projects/mind/" target="_blank" rel="noopener">Mind application for iOS</a>.</p>
        <div id="return-button" class="full-btn" style="margin-top:40px;">Return</div>
      </div>
    </template>

    <script src="js/index.js"></script>
  </body>
</html>
